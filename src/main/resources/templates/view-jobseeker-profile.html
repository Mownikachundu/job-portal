<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>My Profile</title>
</head>

<body>

<h2>My Profile</h2>

<table border="1">

    <tr>
        <th>Phone</th>
        <td th:text="${profile.phone}"></td>
    </tr>

    <tr>
        <th>Address</th>
        <td th:text="${profile.address}"></td>
    </tr>

    <tr>
        <th>Skills</th>
        <td th:text="${profile.skills}"></td>
    </tr>

    <tr>
        <th>Education</th>
        <td th:text="${profile.education}"></td>
    </tr>

    <tr>
        <th>Experience</th>
        <td th:text="${profile.experience}"></td>
    </tr>

    <tr>
        <th>Resume</th>
        <td th:text="${profile.resumeUrl}"></td>
    </tr>

</table>

<br>

<a th:href="@{/jobseeker/profile/edit}">
    <button>Edit Profile</button>
</a>

<a th:href="@{/jobseeker/dashboard}">
    <button>Dashboard</button>
</a>

</body>
</html>
